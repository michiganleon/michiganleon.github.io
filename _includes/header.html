<header class="topbar" id="top">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <ul class="nav">
      <li><a href="{{ '/#news' | relative_url }}">News</a></li>
      <li><a href="{{ '/#publications' | relative_url }}">Publications</a></li>
      <li><a href="{{ '/#experience' | relative_url }}">Experience</a></li>
      <li><a href="{{ '/#photography' | relative_url }}">Photography</a></li>
      <li><a href="{{ '/#beyond' | relative_url }}">Beyond research</a></li>
    </ul>
  </div>
</header>
<script>
  (function () {
    var bar = document.getElementById('top');
    var onScroll = function () { bar.classList.toggle('is-scrolled', window.scrollY > 8); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  })();
</script>
